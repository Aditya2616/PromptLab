[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptlab"
version = "0.1.0"
description = "Evolutionary prompt optimisation: mutate, score on a dev split, select, report once on a held-out test split."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Jain" }]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.11",
  "pandas>=2.2",
  "httpx>=0.27",
  "openai>=1.40",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "huggingface_hub>=0.24",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45"]
dev = ["pytest>=8", "ruff>=0.5"]
ui = ["playwright>=1.45"]

[project.scripts]
promptlab = "promptlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads a real model (deselected by default)"]
addopts = "-m 'not slow' -q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
